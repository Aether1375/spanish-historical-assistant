<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 12px; height: 100vh; display: flex; flex-direction: column; background: #f8f9fa; }
    h3 { margin: 0 0 10px 0; font-size: 15px; color: #202124; display: flex; align-items: center; gap: 6px; }
    #chatContainer { flex: 1; overflow-y: auto; border: 1px solid #dadce0; background: #ffffff; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 8px; font-size: 13px; max-width: 85%; line-height: 1.4; word-wrap: break-word; }
    .msg-user { background: #1a73e8; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-ai { background: #f1f3f4; color: #202124; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #e8eaed; }
    .msg-system { background: #e8f0fe; color: #174ea6; font-size: 12px; text-align: center; align-self: center; border-radius: 12px; padding: 4px 10px; }
    #inputBox { display: flex; gap: 6px; }
    textarea { flex: 1; height: 42px; border: 1px solid #dadce0; border-radius: 6px; padding: 8px; font-size: 13px; resize: none; outline: none; }
    textarea:focus { border-color: #1a73e8; }
    button { background: #1a73e8; color: white; border: none; border-radius: 6px; padding: 0 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1557b0; }
  </style>
</head>
<body>
  <h3>Spanish Indexing Assistant</h3>
  <div id="chatContainer">
    <div class="msg msg-ai">Hello! Show me your Spanish record image on screen and teach me line-by-line or paragraph-by-paragraph. Once I understand your layout rules, I'll ask permission to take over auto-indexing for you.</div>
  </div>
  <div id="inputBox">
    <textarea id="chatInput" placeholder="Teach line-by-line, or reply to assistant..."></textarea>
    <button id="btnSend">Send</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
