<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; padding: 12px; margin: 0; background: #f8f9fa; }
    .card { background: white; border: 1px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .metric { font-weight: bold; color: #1a73e8; }
    button { background: #1a73e8; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 6px; }
    button:hover { background: #1557b0; }
    textarea, input { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    .hidden { display: none; }
    #chatLog { height: 160px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 6px; padding: 8px; background: #fafafa; margin-bottom: 8px; font-size: 13px; }
    .chat-msg { margin-bottom: 8px; }
    .chat-user { color: #1a73e8; font-weight: bold; }
    .chat-ai { color: #2e7d32; }
    .chat-box { display: flex; gap: 6px; }
    .chat-box input { margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h4>1. Teach LLM By Example</h4>
    <p>Saved Teaching Examples: <span id="exampleCount" class="metric">0</span></p>
    <button id="btnCaptureExample" style="background: #6f42c1;">1. Analyze Current Screen Entry</button>
    
    <div id="learningBox" class="hidden" style="margin-top: 10px;">
      <label>Verify / Correct Extracted Fields (JSON format):</label>
      <textarea id="exampleFieldsJson" rows="6"></textarea>
      <button id="btnSaveExample" style="background: #2e7d32;">2. Save as Teaching Example</button>
    </div>
  </div>

  <div class="card">
    <h4>2. Run Auto-Indexing with Learned Logic</h4>
    <button id="btnStartAuto">Run Auto-Pilot Entry</button>
    <button id="btnClearMemory" style="background: #dc3545; margin-top: 4px;">Clear Learned Memory</button>
  </div>

  <div class="card">
    <h4>3. Interactive LLM Assistant Chat</h4>
    <div id="chatLog">
      <div class="chat-msg chat-ai"><strong>Assistant:</strong> Ask me to explain any sentence, transcribe handwriting, or extract specific dates from this document.</div>
    </div>
    <div class="chat-box">
      <input type="text" id="chatInput" placeholder="Ask LLM about this document..." />
      <button id="btnSendChat" style="width: auto;">Send</button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
